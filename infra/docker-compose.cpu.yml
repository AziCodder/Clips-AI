version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: clips
      POSTGRES_PASSWORD: clips
      POSTGRES_DB: clips
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clips"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../cpu-backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ../infra/env/cpu-backend.env
    environment:
      - DEBUG_LOG_PATH=/workspace/debug-31c580.log
    ports:
      - "8001:8000"
    volumes:
      - ..:/workspace
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2

  celery_worker:
    build:
      context: ../cpu-backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ../infra/env/cpu-backend.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=4 -Q default,pipeline,clips

  celery_beat:
    build:
      context: ../cpu-backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ../infra/env/cpu-backend.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.tasks.celery_app beat --loglevel=info --scheduler celery.beat:PersistentScheduler

  bot:
    build:
      context: ../cpu-backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ../infra/env/cpu-backend.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: python -m app.bot.run_polling

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./nginx/frontend.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
